[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paved"
version = "1.0.0"
description = "Dockerized video toolkit: repair broken containers and transcribe speech (offline)."
readme = "Readme.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
license-files = ["LICENSE"]
authors = [{ name = "William Blair" }]

# Core deps only. Transcription engines are optional extras so the repair-only
# install stays light and never fails on a native build that isn't needed.
dependencies = []

[project.optional-dependencies]
faster-whisper = ["faster-whisper>=1.0.0"]
whispercpp = ["pywhispercpp>=1.2.0"]
vosk = ["vosk>=0.3.45"]
sphinx = ["pocketsphinx>=5.0.0"]
ffmpeg = ["imageio-ffmpeg>=0.4.9"]
# Everything, for the Docker image.
all = [
    "faster-whisper>=1.0.0",
    "pywhispercpp>=1.2.0",
    "vosk>=0.3.45",
    "pocketsphinx>=5.0.0",
]
dev = ["pytest>=7"]

[project.scripts]
paved = "paved.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
